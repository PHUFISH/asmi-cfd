<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>อัสมี่ รีโมต</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Prompt', sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* ดันแผงปุ่มลงล่างให้อยู่ในระยะนิ้วโป้ง */
    }

    /* แถบสถานะด้านบน */
    .top-bar {
      position: absolute;
      top: env(safe-area-inset-top, 20px);
      left: 0;
      width: 100%;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #8e8e93;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ff453a;
    }

    .dot.online {
      background-color: #30d158;
      box-shadow: 0 0 8px #30d158;
    }

    /* พื้นที่แสดงยอดเงินด้านบน คล้ายหน้าต่างเครื่องคิดเลข iOS */
    .display-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 0 32px 18px 32px;
    }

    .amount-display {
      font-size: 5rem;
      font-weight: 300;
      letter-spacing: -2px;
      line-height: 1;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .currency-hint {
      font-size: 1.15rem;
      color: #8e8e93;
      margin-top: 6px;
      font-weight: 400;
    }

    /* แผงปุ่มกดสไตล์ iPhone Keypad กะทัดรัด */
    .keypad-wrapper {
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      padding: 0 16px env(safe-area-inset-bottom, 20px) 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      justify-items: center;
    }

    /* ปุ่มกลมสไตล์ iOS */
    .key-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      background-color: #2c2c2e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.1s, transform 0.08s;
    }

    .key-btn:active {
      background-color: #545458;
      transform: scale(0.92);
    }

    .key-digit {
      font-size: 2.1rem;
      font-weight: 400;
      line-height: 1;
    }

    .key-sub {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 2px;
      text-transform: uppercase;
    }

    /* ปุ่มฟังก์ชัน C และ Backspace สไตล์ iOS Function */
    .key-btn.fn-key {
      background-color: #505054;
      color: #ffffff;
    }

    .key-btn.fn-key:active {
      background-color: #767680;
    }

    .key-btn.fn-key .key-digit {
      font-size: 1.5rem;
      font-weight: 500;
    }

    /* แถบปุ่มส่งคำสั่งด้านล่าง */
    .actions-strip {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
      margin-top: 4px;
    }

    .action-btn {
      height: 56px;
      border-radius: 28px;
      border: none;
      font-size: 1.15rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: opacity 0.1s, transform 0.08s;
    }

    .action-btn:active {
      opacity: 0.8;
      transform: scale(0.96);
    }

    .btn-send-qr {
      background-color: #0071e3; /* สีฟ้า Apple System */
      color: #ffffff;
    }

    .btn-success-check {
      background-color: #30d158; /* สีเขียว Apple System */
      color: #ffffff;
    }

    .action-btn svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.4;
    }
  </style>
</head>
<body>

  <!-- แถบบน -->
  <div class="top-bar">
    <div class="connection-status">
      <div id="dot" class="dot"></div>
      <span id="status-text">กำลังเชื่อมต่อ...</span>
    </div>
    <div>Asmi Terminal</div>
  </div>

  <!-- จอแสดงยอดเงินตัวเลขแบบเครื่องคิดเลข iOS -->
  <div class="display-container">
    <div id="display-num" class="amount-display">0</div>
    <div class="currency-hint">บาท</div>
  </div>

  <!-- แผง Keypad กะทัดรัด จับมือเดียวกดถึงทุกปุ่ม -->
  <div class="keypad-wrapper">
    <div class="keypad-grid">
      <!-- แถว 1 -->
      <button class="key-btn" onclick="press('1')">
        <span class="key-digit">1</span>
        <span class="key-sub">&nbsp;</span>
      </button>
      <button class="key-btn" onclick="press('2')">
        <span class="key-digit">2</span>
        <span class="key-sub">ABC</span>
      </button>
      <button class="key-btn" onclick="press('3')">
        <span class="key-digit">3</span>
        <span class="key-sub">DEF</span>
      </button>

      <!-- แถว 2 -->
      <button class="key-btn" onclick="press('4')">
        <span class="key-digit">4</span>
        <span class="key-sub">GHI</span>
      </button>
      <button class="key-btn" onclick="press('5')">
        <span class="key-digit">5</span>
        <span class="key-sub">JKL</span>
      </button>
      <button class="key-btn" onclick="press('6')">
        <span class="key-digit">6</span>
        <span class="key-sub">MNO</span>
      </button>

      <!-- แถว 3 -->
      <button class="key-btn" onclick="press('7')">
        <span class="key-digit">7</span>
        <span class="key-sub">PQRS</span>
      </button>
      <button class="key-btn" onclick="press('8')">
        <span class="key-digit">8</span>
        <span class="key-sub">TUV</span>
      </button>
      <button class="key-btn" onclick="press('9')">
        <span class="key-digit">9</span>
        <span class="key-sub">WXYZ</span>
      </button>

      <!-- แถว 4 -->
      <button class="key-btn fn-key" onclick="clearAll()">
        <span class="key-digit">C</span>
      </button>
      <button class="key-btn" onclick="press('0')">
        <span class="key-digit">0</span>
        <span class="key-sub">+</span>
      </button>
      <button class="key-btn fn-key" onclick="backspace()">
        <span class="key-digit">⌫</span>
      </button>
    </div>

    <!-- แถบปุ่มส่งยอดเข้า iPad -->
    <div class="actions-strip">
      <button class="action-btn btn-send-qr" onclick="sendPay()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
        </svg>
        <span>ส่ง QR</span>
      </button>

      <button class="action-btn btn-success-check" onclick="sendDone()" title="ลูกค้าจ่ายเสร็จ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const MQTT_TOPIC = "asmi_cfd_pos_99/command";
    let inputVal = "0";

    const elDisplay = document.getElementById('display-num');
    const elDot = document.getElementById('dot');
    const elStatus = document.getElementById('status-text');

    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

    client.on('connect', () => {
      elDot.classList.add('online');
      elStatus.innerText = "พร้อมใช้งาน";
    });

    client.on('offline', () => {
      elDot.classList.remove('online');
      elStatus.innerText = "หลุดการเชื่อมต่อ";
    });

    // สั่นตอบสนองเบาๆ แบบ Haptic เมื่อกดปุ่มบน iPhone
    function haptic() {
      if (navigator.vibrate) {
        navigator.vibrate(10);
      }
    }

    function updateView() {
      elDisplay.innerText = inputVal;
    }

    function press(n) {
      haptic();
      if (inputVal === "0") {
        inputVal = n;
      } else if (inputVal.length < 5) {
        inputVal += n;
      }
      updateView();
    }

    function backspace() {
      haptic();
      inputVal = inputVal.slice(0, -1);
      if (inputVal === "") inputVal = "0";
      updateView();
    }

    function clearAll() {
      haptic();
      inputVal = "0";
      updateView();
      client.publish(MQTT_TOPIC, JSON.stringify({ type: "RESET" }));
    }

    function sendPay() {
      haptic();
      const amount = parseFloat(inputVal);
      if (amount > 0) {
        client.publish(MQTT_TOPIC, JSON.stringify({ 
          type: "DIRECT_PAY", 
          amount: amount 
        }));
      }
    }

    function sendDone() {
      haptic();
      client.publish(MQTT_TOPIC, JSON.stringify({ type: "SUCCESS" }));
      inputVal = "0";
      updateView();
    }
  </script>
</body>
</html>
