<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>อัสมี่ ลูกชิ้นย่างเตาถ่าน & ต้มแซ่บเนื้อ ฮาลาล</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Kanit:ital,wght@0,300;0,400;0,600;0,700;0,800&family=Amiri:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- MQTT Library -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Prompt', 'Kanit', -apple-system, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #040508;
      color: #ffffff;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
      opacity: 0;
      visibility: hidden;
      z-index: 1;
    }

    .screen.active {
      opacity: 1;
      visibility: visible;
      z-index: 2;
    }

    /* ==========================================
       1. IDLE STATE: อวกาศมีชีวิต กาแล็กซีวิ้งวับ
       ========================================== */
    #screen-idle {
      background: radial-gradient(circle at 50% 50%, #0d111a 0%, #06080d 70%, #020305 100%);
      cursor: pointer;
      overflow: hidden;
    }

    #galaxy-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .nebula-glow {
      position: absolute;
      width: 750px;
      height: 520px;
      background: radial-gradient(ellipse at center, rgba(255, 140, 50, 0.12) 0%, rgba(255, 180, 50, 0.05) 40%, rgba(0, 119, 182, 0.03) 70%, transparent 80%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(70px);
      pointer-events: none;
      animation: nebulaPulse 9s ease-in-out infinite alternate;
      z-index: 2;
    }

    .nebula-glow-secondary {
      position: absolute;
      width: 500px;
      height: 380px;
      background: radial-gradient(circle, rgba(0, 150, 255, 0.08) 0%, transparent 70%);
      top: 45%;
      left: 55%;
      transform: translate(-50%, -50%);
      filter: blur(80px);
      pointer-events: none;
      animation: nebulaDrift 14s ease-in-out infinite alternate;
      z-index: 2;
    }

    .signage-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 90%;
      max-width: 900px;
      margin-top: -15px;
      pointer-events: none;
      z-index: 3;
    }

    .brand-top-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .brand-name {
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 8px;
      color: #e2e8f0;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
    }

    .halal-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 75, 46, 0.55);
      border: 1px solid rgba(212, 175, 55, 0.7);
      border-radius: 30px;
      padding: 3px 14px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.5), 0 0 15px rgba(212, 175, 55, 0.2);
    }

    .halal-arabic {
      font-family: 'Amiri', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffd166;
      line-height: 1;
      padding-bottom: 2px;
    }

    .halal-thai {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .hero-main {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.5px;
      color: #ffffff;
      text-shadow: 0 4px 25px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 255, 255, 0.18);
      margin-bottom: 8px;
    }

    .hero-secondary {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 2.7rem;
      font-weight: 600;
      color: #ffb703;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 183, 3, 0.25);
    }

    .hero-secondary .amp {
      font-size: 2.2rem;
      color: #94a3b8;
      font-weight: 400;
    }

    .bottom-hint {
      position: absolute;
      bottom: 26px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      color: #718096;
      pointer-events: none;
      z-index: 3;
    }

    .payment-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 3px 12px;
      color: #cbd5e1;
      font-size: 0.85rem;
    }

    /* 2. INPUT STATE */
    #screen-input {
      background: radial-gradient(circle at center, #141b26 0%, #090d14 100%);
    }

    .input-label {
      font-size: 2.2rem;
      font-weight: 600;
      color: #90e0ef;
      margin-bottom: 22px;
    }

    .input-amount-wrapper {
      display: flex;
      align-items: baseline;
      gap: 18px;
      background: rgba(255, 255, 255, 0.05);
      padding: 24px 68px;
      border-radius: 28px;
      border: 2px solid rgba(144, 224, 239, 0.35);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    }

    .input-amount {
      font-size: 7.2rem;
      font-weight: 800;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .input-currency {
      font-size: 2.5rem;
      font-weight: 600;
      color: #94a3b8;
    }

    /* ==========================================
       3. PAYMENT STATE: การ์ดขยายเต็มตาสวยงาม
       ========================================== */
    #screen-payment {
      background: radial-gradient(circle at center, #0d1527 0%, #040711 100%);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .thung-card {
      background: #ffffff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 50px rgba(0, 55, 100, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 92vw;
      max-width: 540px;
      max-height: 88vh;
      animation: popCard 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .thung-header {
      width: 100%;
      background: #003764;
      padding: 14px 24px 12px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .thai-qr-logo-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .thai-qr-logo-row svg {
      width: 24px;
      height: 24px;
    }

    .support-badges-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.82rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    .badge-tag {
      background: rgba(255, 255, 255, 0.16);
      padding: 2px 10px;
      border-radius: 6px;
      color: #ffffff;
    }

    .badge-tag.tm {
      background: linear-gradient(135deg, #f58220, #ffbc00);
      color: #ffffff;
    }

    .thung-qr-body {
      padding: 22px 28px 12px 28px;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .shop-title-area {
      text-align: center;
      padding: 4px 20px 14px 20px;
      background: #ffffff;
      width: 100%;
    }

    .shop-name-label {
      font-size: 1.65rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.2px;
      line-height: 1.2;
    }

    .shop-subtitle {
      font-size: 0.88rem;
      color: #64748b;
      margin-top: 3px;
      font-weight: 500;
    }

    .thung-amount-strip {
      width: 100%;
      background: #f8fafc;
      border-top: 1.5px solid #e2e8f0;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .amount-label-left {
      font-size: 1.2rem;
      font-weight: 600;
      color: #475569;
    }

    .amount-value-right {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .amount-digits {
      font-size: 3rem;
      font-weight: 800;
      color: #003764;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
    }

    .amount-baht-text {
      font-size: 1.25rem;
      font-weight: 600;
      color: #64748b;
    }

    .btn-save-qr {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 10px 28px;
      color: #e2e8f0;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }

    .btn-save-qr:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: #ffd166;
      color: #ffd166;
    }

    .btn-save-qr:active {
      transform: scale(0.95);
    }

    .btn-save-qr svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
    }

    /* 4. SUCCESS STATE */
    #screen-success {
      background: radial-gradient(circle at center, #0c2d1b 0%, #05140c 100%);
    }

    .success-icon {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #2dc653;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 50px rgba(45, 198, 83, 0.5);
      margin-bottom: 26px;
    }

    .success-icon svg {
      width: 76px;
      height: 76px;
      stroke: #ffffff;
      stroke-width: 4.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .success-text {
      font-size: 3rem;
      font-weight: 700;
      color: #d8f3dc;
    }

    /* VIRTUAL NUMPAD CONTROLS */
    #btn-numpad-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(40, 48, 65, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    #btn-numpad-toggle:active {
      transform: scale(0.92);
    }

    #btn-numpad-toggle svg {
      width: 26px;
      height: 26px;
      fill: #ffffff;
      pointer-events: none;
    }

    #virtual-numpad-panel {
      position: fixed;
      bottom: 88px;
      right: 20px;
      background: #12161f;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      display: none;
      grid-template-columns: repeat(3, 66px);
      gap: 10px;
      z-index: 10001;
    }

    #virtual-numpad-panel.show {
      display: grid;
    }

    .vk-btn {
      height: 54px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #ffffff;
      font-size: 1.4rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .vk-btn:active {
      background: rgba(255, 255, 255, 0.3);
    }

    .vk-btn.fn-clear { color: #ff6b6b; font-size: 1.15rem; }
    .vk-btn.fn-enter {
      background: #2a9d8f;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
    }
    .vk-btn.fn-enter:active { background: #21867a; }

    @keyframes nebulaPulse {
      0% {
        transform: translate(-50%, -50%) scale(0.92);
        opacity: 0.6;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.15);
        opacity: 0.95;
      }
    }

    @keyframes nebulaDrift {
      0% {
        transform: translate(-52%, -48%) scale(0.9);
      }
      100% {
        transform: translate(-46%, -52%) scale(1.1);
      }
    }

    @keyframes popCard {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- 1. Idle Screen -->
  <div id="screen-idle" class="screen active">
    <canvas id="galaxy-canvas"></canvas>
    <div class="nebula-glow"></div>
    <div class="nebula-glow-secondary"></div>
    
    <div class="signage-container">
      <div class="brand-top-row">
        <div class="brand-name">อัสมี่</div>
        <div class="halal-badge">
          <span class="halal-arabic">حلال</span>
          <span class="halal-thai">ฮาลาล</span>
        </div>
      </div>

      <div class="hero-main">ลูกชิ้นย่างเตาถ่าน</div>

      <div class="hero-secondary">
        <span class="amp">&</span>
        <span>ต้มแซ่บเนื้อ</span>
      </div>
    </div>

    <div class="bottom-hint">
      <span>พร้อมรับชำระ</span>
      <div class="payment-pill">พร้อมเพย์</div>
      <div class="payment-pill">TrueMoney</div>
    </div>
  </div>

  <!-- 2. Input Screen -->
  <div id="screen-input" class="screen">
    <div class="input-label">ยอดที่ต้องชำระ</div>
    <div class="input-amount-wrapper">
      <div id="display-amount" class="input-amount">0</div>
      <div class="input-currency">บาท</div>
    </div>
  </div>

  <!-- 3. Payment Screen -->
  <div id="screen-payment" class="screen">
    <div class="thung-card">
      <div class="thung-header">
        <div class="thai-qr-logo-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
          <span>THAI QR PAYMENT</span>
        </div>
        <div class="support-badges-row">
          <span class="badge-tag">PromptPay</span>
          <span class="badge-tag tm">TrueMoney</span>
          <span>สแกนจ่ายได้ทุกธนาคาร</span>
        </div>
      </div>

      <div class="thung-qr-body">
        <div id="qrcode"></div>
      </div>

      <div class="shop-title-area">
        <div class="shop-name-label">อัสมี่ลูกชิ้นย่าง</div>
        <div class="shop-subtitle">สแกนชำระผ่านโมบายแบงก์กิ้งหรือกระเป๋าเงินดิจิทัล</div>
      </div>

      <div class="thung-amount-strip">
        <div class="amount-label-left">ยอดเงิน</div>
        <div class="amount-value-right">
          <span id="payment-amount-label" class="amount-digits">0</span>
          <span class="amount-baht-text">บาท</span>
        </div>
      </div>
    </div>

    <button id="btn-save-qr" class="btn-save-qr">
      <svg viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      <span>บันทึก QR</span>
    </button>
  </div>

  <!-- 4. Success Screen -->
  <div id="screen-success" class="screen">
    <div class="success-icon">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <div class="success-text">ชำระเงินสำเร็จ</div>
  </div>

  <!-- ปุ่มเปิด Numpad บนหน้าจอ -->
  <div id="btn-numpad-toggle" title="เปิดแป้นพิมพ์">
    <svg viewBox="0 0 24 24">
      <rect x="2" y="4" width="20" height="16" rx="3" stroke="currentColor" fill="none" stroke-width="1.8"/>
      <circle cx="6" cy="9" r="1.2"/>
      <circle cx="10" cy="9" r="1.2"/>
      <circle cx="14" cy="9" r="1.2"/>
      <circle cx="18" cy="9" r="1.2"/>
      <circle cx="6" cy="14" r="1.2"/>
      <circle cx="10" cy="14" r="1.2"/>
      <circle cx="14" cy="14" r="1.2"/>
      <circle cx="18" cy="14" r="1.2"/>
    </svg>
  </div>

  <!-- แผง Numpad สัมผัส -->
  <div id="virtual-numpad-panel">
    <button class="vk-btn" data-key="7">7</button>
    <button class="vk-btn" data-key="8">8</button>
    <button class="vk-btn" data-key="9">9</button>
    <button class="vk-btn" data-key="4">4</button>
    <button class="vk-btn" data-key="5">5</button>
    <button class="vk-btn" data-key="6">6</button>
    <button class="vk-btn" data-key="1">1</button>
    <button class="vk-btn" data-key="2">2</button>
    <button class="vk-btn" data-key="3">3</button>
    <button class="vk-btn fn-clear" data-key="Clear">C</button>
    <button class="vk-btn" data-key="0">0</button>
    <button class="vk-btn fn-clear" data-key="Backspace">⌫</button>
    <button class="vk-btn fn-enter" data-key="Enter" style="grid-column: span 3;">ยืนยัน (Enter)</button>
  </div>

  <script>
    const RAW_QR_TEMPLATE = "00020101021130870016A00000067701011201150105546149531300220M00000000012936608730320S000000000000024615053037645802TH6304D0E9";
    const AUTO_TIMEOUT_SEC = 40;

    const STATES = { IDLE: 'IDLE', INPUT: 'INPUT', PAYMENT: 'PAYMENT', SUCCESS: 'SUCCESS' };
    let currentState = STATES.IDLE;
    let inputBuffer = "";
    let autoTimeoutTimer = null;
    let qrGenerator = null;
    let audioCtx = null;

    const elIdle = document.getElementById('screen-idle');
    const elInput = document.getElementById('screen-input');
    const elPayment = document.getElementById('screen-payment');
    const elSuccess = document.getElementById('screen-success');
    const elDisplayAmount = document.getElementById('display-amount');
    const elPaymentAmountLabel = document.getElementById('payment-amount-label');
    const elQrBox = document.getElementById('qrcode');
    const btnSaveQr = document.getElementById('btn-save-qr');
    const numpadToggle = document.getElementById('btn-numpad-toggle');
    const numpadPanel = document.getElementById('virtual-numpad-panel');

    // ==========================================
    // COSMIC LIVING ENGINE (กาแล็กซีขยับวิบวับ + ดาวตก)
    // ==========================================
    const canvas = document.getElementById('galaxy-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let shootingStars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initStars();
    }

    function initStars() {
      stars = [];
      const starCount = Math.floor((canvas.width * canvas.height) / 5500);
      for (let i = 0; i < starCount; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.5 + 0.4,
          baseAlpha: Math.random() * 0.5 + 0.2,
          currentAlpha: Math.random() * 0.7 + 0.3,
          twinkleSpeed: Math.random() * 0.03 + 0.008,
          twinklePhase: Math.random() * Math.PI * 2,
          vx: (Math.random() - 0.5) * 0.08,
          vy: (Math.random() - 0.5) * 0.08,
          color: Math.random() > 0.8 ? '#ffd166' : (Math.random() > 0.6 ? '#90e0ef' : '#ffffff')
        });
      }
    }

    function spawnShootingStar() {
      if (shootingStars.length < 2 && Math.random() < 0.012) {
        shootingStars.push({
          x: Math.random() * (canvas.width * 0.7),
          y: Math.random() * (canvas.height * 0.35),
          len: Math.random() * 80 + 50,
          speed: Math.random() * 7 + 5,
          angle: Math.PI / 4 + (Math.random() * 0.2 - 0.1),
          alpha: 1,
          decay: Math.random() * 0.02 + 0.015
        });
      }
    }

    function renderCosmic() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        s.twinklePhase += s.twinkleSpeed;
        const pulse = Math.sin(s.twinklePhase);
        const alpha = Math.max(0.1, Math.min(1, s.baseAlpha + pulse * 0.45));

        s.x += s.vx;
        s.y += s.vy;
        if (s.x < 0) s.x = canvas.width;
        if (s.x > canvas.width) s.x = 0;
        if (s.y < 0) s.y = canvas.height;
        if (s.y > canvas.height) s.y = 0;

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fillStyle = s.color;
        ctx.globalAlpha = alpha;
        ctx.fill();

        if (s.radius > 1.3 && alpha > 0.6) {
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius * 2.2, 0, Math.PI * 2);
          ctx.fillStyle = s.color;
          ctx.globalAlpha = alpha * 0.25;
          ctx.fill();
        }
      }

      spawnShootingStar();
      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const st = shootingStars[i];
        const tailX = st.x - Math.cos(st.angle) * st.len;
        const tailY = st.y - Math.sin(st.angle) * st.len;

        const grad = ctx.createLinearGradient(st.x, st.y, tailX, tailY);
        grad.addColorStop(0, `rgba(255, 255, 255, ${st.alpha})`);
        grad.addColorStop(0.3, `rgba(255, 209, 102, ${st.alpha * 0.7})`);
        grad.addColorStop(1, `rgba(255, 255, 255, 0)`);

        ctx.beginPath();
        ctx.moveTo(st.x, st.y);
        ctx.lineTo(tailX, tailY);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.8;
        ctx.lineCap = 'round';
        ctx.globalAlpha = 1;
        ctx.stroke();

        st.x += Math.cos(st.angle) * st.speed;
        st.y += Math.sin(st.angle) * st.speed;
        st.alpha -= st.decay;

        if (st.alpha <= 0) {
          shootingStars.splice(i, 1);
        }
      }

      ctx.globalAlpha = 1;
      requestAnimationFrame(renderCosmic);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    renderCosmic();

    // ==========================================
    // AUDIO ENGINE: กระตุ้นเสียงบน iOS Safari + เสียงวิ้ง ปริ๊ง ปริ๊ง
    // ==========================================
    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playDing() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(750, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {}
    }

    // เสียงเอฟเฟกต์ "วิ้ง ปริ๊ง ปริ๊ง ✨" ตอนชำระสำเร็จ
    function playSuccessChime() {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const notes = [1046.50, 1318.51, 1567.98, 2093.00]; // โน้ต C6, E6, G6, C7

        notes.forEach((freq, index) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + index * 0.08);

          gain.gain.setValueAtTime(0, now + index * 0.08);
          gain.gain.linearRampToValueAtTime(0.25, now + index * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.6);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now + index * 0.08);
          osc.stop(now + index * 0.08 + 0.6);
        });
      } catch (e) {}
    }

    function speakAmount(amount) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const num = parseFloat(amount);
        const utterance = new SpeechSynthesisUtterance(`ยอดเงิน ${num} บาท`);
        utterance.lang = 'th-TH';
        utterance.rate = 1.05;
        window.speechSynthesis.resume();
        window.speechSynthesis.speak(utterance);
      }
    }

    function crc16(data) {
      let crc = 0xFFFF;
      for (let i = 0; i < data.length; i++) {
        let x = ((crc >> 8) ^ data.charCodeAt(i)) & 0xFF;
        x ^= x >> 4;
        crc = ((crc << 8) ^ (x << 12) ^ (x << 5) ^ x) & 0xFFFF;
      }
      return crc.toString(16).toUpperCase().padStart(4, '0');
    }

    function formatTag(id, val) {
      const len = val.length.toString().padStart(2, '0');
      return `${id}${len}${val}`;
    }

    function injectAmountToRawQR(rawQr, amount) {
      let tags = {};
      let index = 0;
      const fAmount = parseFloat(amount).toFixed(2);

      while (index < rawQr.length) {
        const id = rawQr.substr(index, 2);
        const len = parseInt(rawQr.substr(index + 2, 2), 10);
        const val = rawQr.substr(index + 4, len);
        tags[id] = val;
        index += 4 + len;
      }

      tags["01"] = "12";
      tags["53"] = "764";
      tags["54"] = fAmount;
      tags["58"] = "TH";
      delete tags["63"];

      let rebuilt = "";
      for (const key of Object.keys(tags).sort()) {
        rebuilt += formatTag(key, tags[key]);
      }
      rebuilt += "6304";
      return rebuilt + crc16(rebuilt);
    }

    function getCardQRSize() {
      const isPortrait = window.innerHeight > window.innerWidth;
      if (isPortrait) {
        const maxAllowed = Math.min(window.innerWidth * 0.65, 340);
        return Math.floor(Math.min(maxAllowed, window.innerHeight * 0.40));
      } else {
        return Math.floor(Math.min(window.innerHeight * 0.46, 320));
      }
    }

    function renderQR(amount) {
      const payload = injectAmountToRawQR(RAW_QR_TEMPLATE, amount);
      const qrDimension = getCardQRSize();
      elQrBox.innerHTML = "";
      qrGenerator = new QRCode(elQrBox, {
        text: payload,
        width: qrDimension,
        height: qrDimension,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function setScreenState(nextState) {
      currentState = nextState;
      [elIdle, elInput, elPayment, elSuccess].forEach(s => s.classList.remove('active'));
      clearTimeout(autoTimeoutTimer);

      if (nextState === STATES.IDLE) {
        inputBuffer = "";
        elIdle.classList.add('active');
      } else if (nextState === STATES.INPUT) {
        elDisplayAmount.innerText = inputBuffer || "0";
        elInput.classList.add('active');
        resetAutoTimeout();
      } else if (nextState === STATES.PAYMENT) {
        elPayment.classList.add('active');
        resetAutoTimeout();
      } else if (nextState === STATES.SUCCESS) {
        playSuccessChime(); // เล่นเสียง ปริ๊ง ปริ๊ง
        elSuccess.classList.add('active');
        setTimeout(() => setScreenState(STATES.IDLE), 2500);
      }
    }

    function resetAutoTimeout() {
      clearTimeout(autoTimeoutTimer);
      autoTimeoutTimer = setTimeout(() => {
        setScreenState(STATES.IDLE);
      }, AUTO_TIMEOUT_SEC * 1000);
    }

    btnSaveQr.addEventListener('click', (e) => {
      e.stopPropagation();
      const canvasQR = elQrBox.querySelector('canvas');
      const img = elQrBox.querySelector('img');
      let dataUrl = "";

      if (canvasQR) {
        dataUrl = canvasQR.toDataURL("image/png");
      } else if (img && img.src) {
        dataUrl = img.src;
      }

      if (dataUrl) {
        const link = document.createElement('a');
        link.download = `QR_Asmi_${inputBuffer || 'payment'}.png`;
        link.href = dataUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    });

    function handleAction(key) {
      initAudio();
      if (key === "NumpadEnter") key = "Enter";

      if (currentState === STATES.IDLE) {
        playDing();
        inputBuffer = /\d/.test(key) ? key : "";
        setScreenState(STATES.INPUT);
        return;
      }

      if (currentState === STATES.INPUT) {
        if (/\d/.test(key)) {
          if (inputBuffer === "0") inputBuffer = "";
          if (inputBuffer.length < 5) {
            inputBuffer += key;
            elDisplayAmount.innerText = inputBuffer;
            resetAutoTimeout();
          }
        } else if (key === "Backspace") {
          inputBuffer = inputBuffer.slice(0, -1);
          elDisplayAmount.innerText = inputBuffer || "0";
          resetAutoTimeout();
        } else if (key === "Escape" || key === "Clear") {
          setScreenState(STATES.IDLE);
        } else if (key === "Enter") {
          const num = parseFloat(inputBuffer);
          if (num > 0) {
            elPaymentAmountLabel.innerText = num.toLocaleString('th-TH');
            renderQR(num);
            setScreenState(STATES.PAYMENT);
            setTimeout(() => speakAmount(num), 100);
          }
        }
        return;
      }

      if (currentState === STATES.PAYMENT) {
        if (key === "Enter" || key === "+" || key === "NumpadAdd") {
          setScreenState(STATES.SUCCESS);
        } else if (key === "Escape" || key === "Backspace" || key === "Clear") {
          setScreenState(STATES.IDLE);
        }
        return;
      }
    }

    window.addEventListener('keydown', (e) => {
      handleAction(e.key);
    });

    document.querySelectorAll('.vk-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const key = btn.getAttribute('data-key');
        handleAction(key);
      });
    });

    numpadToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudio();
      numpadPanel.classList.toggle('show');
    });

    elIdle.addEventListener('click', () => {
      initAudio();
      playDing();
      setScreenState(STATES.INPUT);
    });

    window.addEventListener('resize', () => {
      if (currentState === STATES.PAYMENT && inputBuffer) {
        renderQR(parseFloat(inputBuffer));
      }
    });

    // MQTT SYNC
    const MQTT_TOPIC = "asmi_cfd_pos_99/command";
    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

    client.on('connect', () => {
      console.log('✅ iPad Connected to MQTT Broker');
      client.subscribe(MQTT_TOPIC);
    });

    client.on('message', (topic, message) => {
      if (topic === MQTT_TOPIC) {
        try {
          const data = JSON.parse(message.toString());
          if (data.type === "KEY") {
            handleAction(data.key);
          } else if (data.type === "DIRECT_PAY") {
            initAudio();
            inputBuffer = String(data.amount);
            const num = parseFloat(inputBuffer);
            if (num > 0) {
              elPaymentAmountLabel.innerText = num.toLocaleString('th-TH');
              renderQR(num);
              setScreenState(STATES.PAYMENT);
              setTimeout(() => {
                speakAmount(num);
              }, 150);
            }
          } else if (data.type === "SUCCESS") {
            setScreenState(STATES.SUCCESS);
          } else if (data.type === "RESET") {
            setScreenState(STATES.IDLE);
          }
        } catch (err) {}
      }
    });
  </script>
</body>
