<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>อัสมี่ รีโมต</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Prompt', sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    /* Pop-up แจ้งเตือนสไตล์ Dynamic Island */
    #island-toast {
      position: fixed;
      top: env(safe-area-inset-top, 14px);
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      background: #1c1c1e;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 113, 227, 0.3);
      opacity: 0;
      pointer-events: none;
      transition: all 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 9999;
    }

    #island-toast.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    #island-toast svg {
      width: 20px;
      height: 20px;
      stroke: #2997ff;
      stroke-width: 2.6;
      fill: none;
    }

    .toast-text {
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    .top-bar {
      position: absolute;
      top: env(safe-area-inset-top, 20px);
      left: 0;
      width: 100%;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: #8e8e93;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ff453a;
    }

    .dot.online {
      background-color: #30d158;
      box-shadow: 0 0 8px #30d158;
    }

    .display-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 0 32px 30px 32px;
    }

    .amount-display {
      font-size: 5.6rem;
      font-weight: 400;
      letter-spacing: -2px;
      line-height: 1;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .currency-hint {
      font-size: 1.35rem;
      color: #8e8e93;
      margin-top: 6px;
      font-weight: 500;
    }

    /* ยกชุดปุ่มหนีขอบล่าง ให้อยู่ระดับนิ้วโป้งพอดี */
    .keypad-wrapper {
      width: 100%;
      max-width: 410px;
      margin: 0 auto;
      padding: 0 16px calc(env(safe-area-inset-bottom, 24px) + 36px) 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      justify-items: center;
    }

    .key-btn {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: none;
      background-color: #2c2c2e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .key-btn:active, .key-btn.is-active {
      background-color: #ffffff !important;
      color: #000000 !important;
      transition: none;
    }

    .key-btn:active .key-sub, .key-btn.is-active .key-sub {
      color: #666666 !important;
    }

    .key-digit {
      font-size: 2.5rem;
      font-weight: 400;
      line-height: 1;
    }

    .key-sub {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 3px;
      text-transform: uppercase;
    }

    .key-btn.fn-key {
      background-color: #505054;
      color: #ffffff;
    }

    .key-btn.fn-key .key-digit {
      font-size: 1.8rem;
      font-weight: 500;
    }

    .actions-strip {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 14px;
      margin-top: 8px;
    }

    .action-btn {
      height: 62px;
      border-radius: 31px;
      border: none;
      font-size: 1.3rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      touch-action: manipulation;
      transition: opacity 0.15s ease, transform 0.08s ease;
    }

    .action-btn:active {
      opacity: 0.75;
      transform: scale(0.96);
    }

    .btn-send-qr {
      background-color: #0071e3;
      color: #ffffff;
    }

    .btn-success-check {
      background-color: #30d158;
      color: #ffffff;
    }

    .action-btn svg {
      width: 24px;
      height: 24px;
      stroke-width: 2.5;
    }
  </style>
</head>
<body>

  <!-- Dynamic Island Pop-up Banner -->
  <div id="island-toast">
    <svg viewBox="0 0 24 24">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span id="toast-msg" class="toast-text">ส่งยอดเรียบร้อย</span>
  </div>

  <div class="top-bar">
    <div class="connection-status">
      <div id="dot" class="dot"></div>
      <span id="status-text">กำลังเชื่อมต่อ...</span>
    </div>
    <div>Asmi Terminal</div>
  </div>

  <div class="display-container">
    <div id="display-num" class="amount-display">0</div>
    <div class="currency-hint">บาท</div>
  </div>

  <div class="keypad-wrapper">
    <div class="keypad-grid">
      <button class="key-btn" data-key="1">
        <span class="key-digit">1</span>
        <span class="key-sub">&nbsp;</span>
      </button>
      <button class="key-btn" data-key="2">
        <span class="key-digit">2</span>
        <span class="key-sub">ABC</span>
      </button>
      <button class="key-btn" data-key="3">
        <span class="key-digit">3</span>
        <span class="key-sub">DEF</span>
      </button>

      <button class="key-btn" data-key="4">
        <span class="key-digit">4</span>
        <span class="key-sub">GHI</span>
      </button>
      <button class="key-btn" data-key="5">
        <span class="key-digit">5</span>
        <span class="key-sub">JKL</span>
      </button>
      <button class="key-btn" data-key="6">
        <span class="key-digit">6</span>
        <span class="key-sub">MNO</span>
      </button>

      <button class="key-btn" data-key="7">
        <span class="key-digit">7</span>
        <span class="key-sub">PQRS</span>
      </button>
      <button class="key-btn" data-key="8">
        <span class="key-digit">8</span>
        <span class="key-sub">TUV</span>
      </button>
      <button class="key-btn" data-key="9">
        <span class="key-digit">9</span>
        <span class="key-sub">WXYZ</span>
      </button>

      <button class="key-btn fn-key" data-action="clear">
        <span class="key-digit">C</span>
      </button>
      <button class="key-btn" data-key="0">
        <span class="key-digit">0</span>
        <span class="key-sub">+</span>
      </button>
      <button class="key-btn fn-key" data-action="backspace">
        <span class="key-digit">⌫</span>
      </button>
    </div>

    <div class="actions-strip">
      <button class="action-btn btn-send-qr" id="btn-send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
        </svg>
        <span>ส่ง QR</span>
      </button>

      <button class="action-btn btn-success-check" id="btn-done" title="ชำระสำเร็จ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const MQTT_TOPIC = "asmi_cfd_pos_99/command";
    let inputVal = "0";
    let audioCtx = null;
    let toastTimer = null;

    const elDisplay = document.getElementById('display-num');
    const elDot = document.getElementById('dot');
    const elStatus = document.getElementById('status-text');
    const elToast = document.getElementById('island-toast');
    const elToastMsg = document.getElementById('toast-msg');

    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

    client.on('connect', () => {
      elDot.classList.add('online');
      elStatus.innerText = "พร้อมใช้งาน";
    });

    client.on('offline', () => {
      elDot.classList.remove('online');
      elStatus.innerText = "หลุดการเชื่อมต่อ";
    });

    // สั่นตอบสนองตอนกดปุ่มทั่วไป
    function triggerLightHaptic() {
      if (navigator.vibrate) {
        navigator.vibrate(12);
      }
      playTickAudio();
    }

    // สั่นแน่นๆ "ตึก" 1 ครั้ง ตอนกดส่งข้อมูลสำเร็จ
    function triggerHeavyHaptic() {
      if (navigator.vibrate) {
        navigator.vibrate(40);
      }
      playTickAudio(220, 0.06);
    }

    function playTickAudio(freq = 160, duration = 0.04) {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // แสดง Pop-up Dynamic Island
    function showToast(text) {
      elToastMsg.innerText = text;
      elToast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        elToast.classList.remove('show');
      }, 1300);
    }

    function updateView() {
      elDisplay.innerText = inputVal;
    }

    function press(n) {
      triggerLightHaptic();
      if (inputVal === "0") {
        inputVal = n;
      } else if (inputVal.length < 5) {
        inputVal += n;
      }
      updateView();
    }

    function backspace() {
      triggerLightHaptic();
      inputVal = inputVal.slice(0, -1);
      if (inputVal === "") inputVal = "0";
      updateView();
    }

    function clearAll() {
      triggerLightHaptic();
      inputVal = "0";
      updateView();
      client.publish(MQTT_TOPIC, JSON.stringify({ type: "RESET" }));
    }

    function sendPay() {
      const amount = parseFloat(inputVal);
      if (amount > 0) {
        triggerHeavyHaptic(); // สั่นแน่น 1 ที
        showToast(`ส่งยอด ${amount} บาท แล้ว`);
        client.publish(MQTT_TOPIC, JSON.stringify({ 
          type: "DIRECT_PAY", 
          amount: amount 
        }));
      }
    }

    function sendDone() {
      triggerHeavyHaptic(); // สั่นแน่น 1 ที
      showToast("ชำระเงินสำเร็จ ✔");
      client.publish(MQTT_TOPIC, JSON.stringify({ type: "SUCCESS" }));
      inputVal = "0";
      updateView();
    }

    document.querySelectorAll('.key-btn').forEach(btn => {
      btn.addEventListener('touchstart', () => {
        btn.classList.add('is-active');
      }, { passive: true });

      btn.addEventListener('touchend', () => {
        setTimeout(() => btn.classList.remove('is-active'), 80);
      });

      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const digit = btn.getAttribute('data-key');
        const action = btn.getAttribute('data-action');
        if (digit !== null) press(digit);
        else if (action === 'clear') clearAll();
        else if (action === 'backspace') backspace();
      });
    });

    document.getElementById('btn-send').addEventListener('click', sendPay);
    document.getElementById('btn-done').addEventListener('click', sendDone);
  </script>
</body>
</html>
